name: Publish Docker image

on:
  release:
    types: [published]

env:
  REGISTRY: index.docker.io
  IMAGE_NAME: obiba/rock

jobs:
  # Build each variant natively on each architecture, pushed by digest
  build:
    name: Build ${{ matrix.variant.name }} image for ${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        variant:
          - name: default
            file: ./Dockerfile
          - name: native
            file: ./Dockerfile.native
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract metadata (labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Build and push Docker image by digest
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.variant.file }}
          platforms: linux/${{ matrix.platform.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.variant.name }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combine the per-architecture images of each variant into one tagged multi-arch image
  merge:
    name: Push ${{ matrix.variant.name }} multi-arch image to Docker Hub
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        variant:
          - name: default
            suffix: ''
            latest: auto
          - name: native
            suffix: '-native'
            latest: 'false'
    permissions:
      id-token: write
      contents: read
      attestations: write
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.variant.name }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=${{ matrix.variant.latest }}
            suffix=${{ matrix.variant.suffix }}
          tags: |
            type=match,pattern=\d+.\d+.\d+-R\d+.\d+.\d+
            type=match,pattern=\d+.\d+.\d+-R\d+.\d+
            type=match,pattern=\d+.\d+.\d+-R\d+
            type=match,pattern=\d+.\d+.\d+
            type=match,pattern=\d+.\d+
            type=match,pattern=\d+

      - name: Create and push manifest list
        id: push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)
          digest=$(docker buildx imagetools inspect $(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON") --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: false
